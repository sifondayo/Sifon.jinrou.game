<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スプラ・リアルタイム募集ボード</title>
    <style>
        :root {
            --splat-yellow: #eaff00;
            --splat-purple: #6039fd;
            --bg: #121212;
        }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        nav { background: #000; padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--splat-yellow); }
        nav button { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        nav button.active { color: var(--splat-yellow); }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .section { display: none; }
        .active { display: block; }
        .card { background: #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 6px solid var(--splat-purple); cursor: pointer; }
        .tag { background: var(--splat-purple); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        .btn { background: var(--splat-yellow); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .room-id { background: #000; padding: 15px; font-size: 1.5rem; color: var(--splat-yellow); text-align: center; border-radius: 10px; margin: 15px 0; }
    </style>
</head>
<body>

<nav>
    <button onclick="showSection('home')" id="nav-home" class="active">ホーム</button>
    <button onclick="showSection('list')" id="nav-list">部屋一覧</button>
    <button onclick="showSection('create')" id="nav-create">部屋を作る</button>
</nav>

<div class="container">
    <div id="home" class="section active">
        <h1 style="text-align:center">🦑 リアルタイム募集</h1>
        <p style="text-align:center; color:#aaa;">Firebase連携済み！誰かが投稿すると即座に反映されます。</p>
        <button class="btn" onclick="showSection('list')">募集を見に行く</button>
    </div>

    <div id="list" class="section">
        <h3>🔎 現在の募集</h3>
        <div id="room-list">読み込み中...</div>
    </div>

    <div id="create" class="section">
        <h3>✍️ 募集を出す</h3>
        <select id="mode">
            <option>プラベ</option>
            <option>サモラン</option>
            <option>ナワバリ</option>
            <option>オープン</option>
        </select>
        <input type="text" id="pass" placeholder="合流パスワード（4ケタなど）">
        <textarea id="comment" placeholder="メッセージ（例：誰でも歓迎！）"></textarea>
        <button class="btn" id="post-btn" onclick="createRoom()">募集を公開する！</button>
    </div>

    <div id="matching" class="section">
        <div style="background:#333; padding:20px; border-radius:20px; border:2px solid var(--splat-yellow);">
            <h2 id="match-mode">マッチング！</h2>
            <p id="match-comment"></p>
            <div class="room-id" id="match-pass">----</div>
            <button class="btn" style="background:#666; color:white;" onclick="showSection('list')">一覧に戻る</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // あなたのFirebase設定を反映済み！
    const firebaseConfig = {
        apiKey: "AIzaSyAz5X4j05o5BG-yzrsol8KfS-HunIO2qZs",
        authDomain: "supura-mattinngu.firebaseapp.com",
        projectId: "supura-mattinngu",
        storageBucket: "supura-mattinngu.firebasestorage.app",
        messagingSenderId: "202707280577",
        appId: "1:202707280577:web:bff51065a668ad59256a40",
        measurementId: "G-5XFN4T5ENQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const roomsCol = collection(db, "rooms");

    // 画面切り替え
    window.showSection = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const navId = (id === 'matching') ? 'nav-list' : 'nav-' + id;
        document.getElementById(navId).classList.add('active');
    };

    // 投稿機能
    window.createRoom = async () => {
        const mode = document.getElementById('mode').value;
        const pass = document.getElementById('pass').value;
        const comment = document.getElementById('comment').value;
        if(!comment) return alert("メッセージを入れてね！");

        document.getElementById('post-btn').innerText = "送信中...";
        try {
            await addDoc(roomsCol, {
                mode, pass, comment,
                createdAt: serverTimestamp()
            });
            document.getElementById('comment').value = "";
            document.getElementById('post-btn').innerText = "募集を公開する！";
            showSection('list');
        } catch (e) {
            alert("エラー！Firestoreの『ルール』が公開設定になっているか確認してね。");
        }
    };

    // リアルタイム表示機能
    const q = query(roomsCol, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const list = document.getElementById('room-list');
        list.innerHTML = '';
        snapshot.forEach((doc) => {
            const room = doc.data();
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => {
                document.getElementById('match-mode').innerText = room.mode;
                document.getElementById('match-comment').innerText = room.comment;
                document.getElementById('match-pass').innerText = room.pass || "パスなし";
                showSection('matching');
            };
            div.innerHTML = `<span class="tag">${room.mode}</span><div style="margin-top:10px;">${room.comment}</div>`;
            list.appendChild(div);
        });
        if(snapshot.empty) list.innerHTML = "まだ募集がありません。";
    });
</script>

</body>
</html>
